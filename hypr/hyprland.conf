# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=eDP-1,1920x1080@144,0x0,1.0


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = hyprlauncher


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
  exec-once = nm-applet 
  exec-once = waybar
  exec-once = wl-paste --type text --watch cliphist store
  exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# Set Inter as the default UI font (Size 12 is good for 1.0 scale)
env = GTK_FONT_NAME,Inter 12
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 8
    gaps_out = 18

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(cba6f7aa) rgba(89b4faaa) 45deg
    col.inactive_border = rgba(45475aaa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 25
    rounding_power = 2

    # --- TRANSPARENCY SETTINGS ---
    
    # Active window opacity (1.0 is solid, 0.0 is invisible)
    # 0.95 is subtle, 0.85 is very noticeable
    active_opacity = 0.90
    
    # Inactive window opacity (windows you aren't using)
    inactive_opacity = 0.75

    # --- BLUR SETTINGS (Frosted Glass Effect) ---
    blur {
        enabled = true
        size = 10
        passes = 1
        contrast = 4.0
        brightness = 0.8
        vibrancy = 0.15
        vibrancy_darkness = 0.3
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 30
        render_power = 2
        color = rgba(0, 0, 0, 0.25)
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # --- Bezier curves ---
    # The soul of every animation — these control acceleration/deceleration

    bezier = fluid,        0.25, 1,    0.5,  1       # smooth, fast start, gentle landing
    bezier = elastic,      0.05, 0.9,  0.1,  1.08    # slight overshoot — satisfying snap
    bezier = snappy,       0.12, 0,    0.08, 1        # instant response, clean stop
    bezier = overshot,     0.13, 0.99, 0.29, 1.1      # dramatic overshoot for workspaces
    bezier = smoothOut,    0.36, 0,    0.66, -0.56    # fast out, slight pullback
    bezier = linear,       0,    0,    1,    1
    bezier = easeOutExpo,  0.16, 1,    0.3,  1        # explosive start, silky stop


    # --- Border glow ---
    animation = border,           1, 4,   fluid


    # --- Windows opening/closing ---
    # Opens with elastic bounce — feels alive
    animation = windowsIn,        1, 5,   elastic,    popin 70%
    # Closes fast and clean — no waiting
    animation = windowsOut,       1, 3,   snappy,     popin 80%
    # Moving windows feels smooth and weighted
    animation = windowsMove,      1, 4,   fluid


    # --- Fades ---
    animation = fadeIn,           1, 4,   fluid
    animation = fadeOut,          1, 3,   snappy
    animation = fadeSwitch,       1, 3,   fluid
    animation = fadeShadow,       1, 4,   fluid
    animation = fadeDim,          1, 4,   fluid
    animation = fadeLayersIn,     1, 4,   fluid
    animation = fadeLayersOut,    1, 3,   snappy


    # --- Layers (waybar, rofi, notifications) ---
    # Slides in from top smoothly
    animation = layersIn,         1, 4,   fluid,      slide
    animation = layersOut,        1, 3,   snappy,     slide


    # --- Workspaces --- THE most important feel
    # Dramatic overshoot slide — like swiping through water with momentum
    animation = workspaces,       1, 5,   overshot,   slide
    animation = workspacesIn,     1, 5,   overshot,   slide
    animation = workspacesOut,    1, 5,   overshot,   slide
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }
windowrule = decorate off, match:class waybar

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
   
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
   
    focus_on_activate = true
    animate_manual_resizes = true       # Smooth window resizing
    animate_mouse_windowdragging = true # Smooth window dragging
    enable_swallow = true               # Terminal swallows GUI apps cleanly
    swallow_regex = ^(kitty)$
    mouse_move_enables_dpms = true      # Wake screen on mouse move
    key_press_enables_dpms = true       # Wake screen on keypress
    }

# vfr moved to debug: block — required by Hyprland 0.55+
debug {
    vfr = true # Variable frame rate — smooth when active, light when idle
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.8 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.3
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = ALT, F1, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, space, exec, rofi -show drun -show-icons
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy


# 1. Print Screen: Select Area -> Saves to Pictures & Copies to Clipboard
bind = , Print, exec, FILE=~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png; grim -g "$(slurp)" "$FILE" && cat "$FILE" | wl-copy

# 2. Ctrl+Shift+S: Select Area -> Saves to Pictures & Copies to Clipboard
bind = CTRL SHIFT, S, exec, FILE=~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png; grim -g "$(slurp)" "$FILE" && cat "$FILE" | wl-copy


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Alt + Esc: Switch to the previous workspace
bind = ALT, Escape, workspace, previous

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic




# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = rofi-float
    match:class = rofi

    float = true
    center = true
    animation = popin 80%
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

exec-once = awww-daemon

